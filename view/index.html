<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Withings GPX export</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="login" class="login">
      <h2>Withings login</h2>
      <form>
          <input id="email" type="email" class="userinput" placeholder="username">
          <input id="password" type="password" class="userinput" placeholder="password">
          <input type="button" title="Login" value="Login" id="loginButton" class="btn">
      </form>
    </div>
    <div id="activitiesDialog">
      <div id="toolbar" class="toolbar">
        <span id="selectionCount" class="selection-count">0 selected</span>
        <button type="button" id="distanceFilterButton" class="btn btn-secondary">Distance &gt; 0 only</button>
        <button type="button" id="heartrateFilterButton" class="btn btn-secondary">Avg HR &gt; 0 only</button>
        <button type="button" id="selectAllButton" class="btn btn-secondary">Select all shown</button>
        <button type="button" id="clearButton" class="btn btn-secondary">Clear</button>
        <button type="button" id="downloadButton" class="btn" disabled>Download selected</button>
        <div class="filter-row">
          <label>From <input type="date" id="dateFrom" class="date-input"></label>
          <label>To <input type="date" id="dateTo" class="date-input"></label>
          <button type="button" id="resetDatesButton" class="btn btn-secondary">Reset dates</button>
        </div>
      </div>
      <h2>Please select the activities you want to convert to GPX</h2>
      <p class="hint">Click an activity to select it, shift+click to select a range.</p>
        <div id="activities" class="activities">
        </div>
        <div id="loading" class="loading">Loading activities...</div>
        <div id="finished" class="finished">No more activities have been found</div>
    </div>
    <div id="processing" class="overlay">
      <div class="dialog">
        <h2>Downloading data and converting to GPX</h2>
        <p id="progressText" class="progress-text"></p>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
