name: Release

# On every push to master the version in package.json is read and the tag v<version>
# is looked up. If that tag does not exist yet, the Windows installer is built and a
# GitHub Release (which also creates the tag) is published with the installer attached.
# If the tag already exists nothing is built, so releasing means bumping "version".
# It can also be started by hand from the Actions tab (workflow_dispatch):
# in that case the installer is only saved as a workflow artifact.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check the tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi
          BUILD=false
          RELEASE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD=true
          elif [ "$TAG_EXISTS" = "false" ]; then
            BUILD=true
            RELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION tag=$TAG exists=$TAG_EXISTS build=$BUILD release=$RELEASE"

      # Electron 6 and keytar 4 need an old Node to build the native module
      - uses: actions/setup-node@v4
        if: steps.version.outputs.build == 'true'
        with:
          node-version: 14
          cache: yarn

      - name: Install dependencies
        if: steps.version.outputs.build == 'true'
        run: yarn install --frozen-lockfile

      # view/style.css is committed, so the less compilation is not repeated here.
      # electron-builder rebuilds keytar for the bundled Electron version.
      - name: Build installer
        if: steps.version.outputs.build == 'true'
        run: npx electron-builder --win --x64 --ia32 -p never

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build == 'true'
        with:
          name: windows-installer
          path: dist/*.exe

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
